name: CI

# 最小權限：工作流程只需要讀取程式碼
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: scholaragent_test
          POSTGRES_USER: air
          POSTGRES_PASSWORD: air
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U air -d scholaragent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://air:air@localhost:5432/scholaragent_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      # 已知弱點掃描：只看實際部署的相依套件（不含 dev 群組）
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt --disable-pip --no-deps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build

  # 整條研究流程的 UI 測試：真實 API + 建置後的前端，LLM 與論文來源用替身
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install backend and browser
        working-directory: backend
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
      - name: Run UI journey
        working-directory: backend
        env:
          E2E: "1"
        run: uv run pytest tests/e2e -q

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
