# 每週檢查相依套件更新；安全性更新由 GitHub 另外即時開 PR。
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Native dependencies (onnxruntime, torch, faiss) lag new CPython releases by months;
      # move to a new Python version deliberately, together with backend/.python-version
      # and requires-python, once they all publish wheels for it. Patch updates still apply.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
