[project]
name = "scholaragent"
version = "0.1.0"
description = "Research copilot: RAG question answering, GraphRAG, deep research and writing tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=2.4.1",
    "openai>=2.26.0",
    "playwright>=1.58.0",
    "pydantic[email]>=2.14.3",
    "pymupdf>=1.27.1",
    "requests>=2.32.5",
    "discord.py>=2.4.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.3.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.54.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "apscheduler>=3.11.3",
    "psycopg[binary]>=3.3.8",
    "pgvector>=0.4.2",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=prepend"
